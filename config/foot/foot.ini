[main]
title=foot
pad=12x12
term=xterm-256color
font=JetBrainsMono Nerd Font:size=13

[scrollback]
lines=10000
multiplier=1.0

[cursor]
style=beam
blink=yes
blink-rate=500
beam-thickness=1.5

[mouse]
hide-when-typing=yes

[colors-dark]
background=282828
foreground=ebdbb2
alpha=0.85
blur=yes
alpha-mode=default
selection-foreground=ebdbb2
selection-background=504945
urls=83a598

## Normal/regular colors (темніші, базові)
regular0=282828  # black (bg0)
regular1=cc241d  # red
regular2=98971a  # green
regular3=d79921  # yellow
regular4=458588  # blue
regular5=b16286  # magenta (purple)
regular6=689d6a  # cyan (aqua)
regular7=a89984  # white (gray)

## Bright colors (яскраві, контрастні)
bright0=928374   # bright black (gray - для коментарів та автодоповнення)
bright1=fb4934   # bright red
bright2=b8bb26   # bright green
bright3=fabd2f   # bright yellow
bright4=83a598   # bright blue
bright5=d3869b   # bright magenta (purple)
bright6=8ec07c   # bright cyan (aqua)
bright7=ebdbb2   # bright white (fg)

[bell]
system=no

[bell]
system=no
notify=no
urgent=no
